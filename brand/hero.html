<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
:root{--ink:#0B1020;--panel:#121A33;--line:#232C4A;--muted:#8A93B8;--text:#EEF1FF;--lime:#C6F432;--indigo:#4C5BD4}
html,body{margin:0;width:1600px;height:800px;background:var(--ink);font-family:'Space Grotesk',sans-serif;color:var(--text);overflow:hidden}
.wrap{position:relative;height:100%;padding:90px 110px;box-sizing:border-box}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.35;mask-image:radial-gradient(ellipse at 75% 40%,#000 0%,transparent 70%)}
.tag{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.25em;color:var(--lime);text-transform:uppercase}
h1{font-size:132px;line-height:.95;margin:28px 0 0;letter-spacing:-.03em}
h1 span{color:var(--lime)}
p{font-size:34px;color:var(--muted);margin:36px 0 0;max-width:820px;line-height:1.3}
.bars{position:absolute;right:130px;bottom:120px;display:flex;gap:34px;align-items:flex-end}
.bars div{width:110px;border-radius:22px}
.b1{height:170px;background:#2A3352}.b2{height:320px;background:var(--indigo)}.b3{height:500px;background:var(--lime);box-shadow:0 0 80px rgba(198,244,50,.35)}
.foot{position:absolute;left:110px;bottom:80px;font-family:'JetBrains Mono',monospace;font-size:22px;color:var(--muted)}
.foot b{color:var(--text);font-weight:600}
</style></head><body><div class="wrap"><div class="grid"></div>
<div class="tag">● Skills for every coding agent</div>
<h1>Master<br>Your <span>Skills.</span></h1>
<p>Short skills that prove they work. Every one measured with and without.</p>
<div class="foot"><b>23</b> skills &nbsp;·&nbsp; <b>10+</b> agents &nbsp;·&nbsp; benchmarked every <b>3</b> days</div>
<div class="bars"><div class="b1"></div><div class="b2"></div><div class="b3"></div></div>
</div></body></html>
